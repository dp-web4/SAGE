governance_status:
  current: "A1 / A2-shaped cooperative and tamper-evident governance with bounded being intents"
  caveat: "Do not claim complete cryptographic principal separation or OS/kernel adversary-proof containment"
  evidence:
    - "README.md"
    - "sage/docs/LATEST_STATUS.md"
    - "sage/gateway/being_gate_client.py"

memory_status:
  principle: "Selective/compressed memory is not assumed superior to full context"
  paths:
    - "recent context"
    - "salience-gated memory"
    - "structured facts/procedures"
    - "durable verbatim/provenance records"
    - "recoverable model-legible external artifacts"
  caveat: "Lossy summaries can destroy later-needed evidence; compression requires a recovery path"

evidence_rules:
  - "Merged code and live receipts outrank architecture prose"
  - "A commit proves repository state, not deployed machine state"
  - "A mechanism in source is not automatically a demonstrated capability"
  - "Experiment findings remain scoped to model, scaffold, data, and run"
  - "Prefer causal controls, ablations, and trivial baselines where applicable"
  - "Identify whether improvement came from weights, learned controller state, memory, source code, or human/fleet intervention"

