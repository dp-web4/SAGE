<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAGE Dashboard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a0a;
    --surface: #111;
    --border: #222;
    --text: #c8c8c8;
    --text-dim: #666;
    --accent: #00ff41;
    --state-wake: #00ff41;
    --state-focus: #ffd700;
    --state-rest: #4488ff;
    --state-dream: #cc44ff;
    --state-crisis: #ff3333;
    --state-color: var(--state-wake);
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Courier New', monospace;
    font-size: 13px;
    line-height: 1.5;
    min-height: 100vh;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  header h1 { font-size: 14px; font-weight: 600; color: var(--accent); }
  header .meta {
    display: flex; gap: 16px; align-items: center;
    font-size: 11px; color: var(--text-dim);
  }

  .connection-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #ff3333; display: inline-block; transition: background 0.3s;
  }
  .connection-dot.connected { background: var(--accent); }

  .grid {
    display: grid;
    grid-template-columns: 220px 1fr;
    height: calc(100vh - 37px);
  }

  /* Sidebar */
  .sidebar {
    padding: 12px;
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    overflow-y: auto; background: var(--surface);
  }

  .avatar-wrap {
    position: relative; width: 120px; height: 120px;
    border-radius: 10px; overflow: hidden; flex-shrink: 0;
  }
  .avatar-wrap img {
    width: 100%; height: 100%; object-fit: cover; border-radius: 10px;
  }
  .avatar-wrap::after {
    content: ''; position: absolute; inset: -3px;
    border-radius: 13px; border: 2px solid var(--state-color);
    box-shadow: 0 0 16px color-mix(in srgb, var(--state-color) 40%, transparent);
    animation: glow 2s ease-in-out infinite; pointer-events: none;
  }
  @keyframes glow { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }

  .machine-name {
    font-size: 16px; font-weight: 700; color: white;
    text-transform: uppercase; letter-spacing: 2px;
  }
  .metabolic-badge {
    display: inline-block; padding: 3px 12px; border-radius: 20px;
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
    background: color-mix(in srgb, var(--state-color) 15%, transparent);
    color: var(--state-color); border: 1px solid var(--state-color);
  }
  .model-label { font-size: 10px; color: var(--text-dim); }

  .stats-section { width: 100%; margin-top: 4px; display: flex; flex-direction: column; gap: 6px; }

  .stat-compact {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 10px;
  }
  .stat-compact label {
    display: block; font-size: 9px; text-transform: uppercase;
    letter-spacing: 1px; color: var(--text-dim); margin-bottom: 2px;
  }
  .stat-compact .value { font-size: 14px; font-weight: 700; color: white; }
  .stat-compact .sub { font-size: 10px; color: var(--text-dim); }

  .stat-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }

  .bar-wrap { background: #1a1a1a; border-radius: 3px; height: 6px; overflow: hidden; margin-top: 3px; }
  .bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease, background 0.5s ease; }
  .bar-fill.atp { background: linear-gradient(90deg, #ff3333, #ffd700, #00ff41); background-size: 300% 100%; }

  .snarc-row { display: flex; align-items: center; gap: 4px; font-size: 10px; }
  .snarc-row .name { width: 60px; color: var(--text-dim); }
  .snarc-row .mini-bar { flex: 1; height: 4px; background: #1a1a1a; border-radius: 2px; overflow: hidden; }
  .snarc-row .mini-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.5s; }
  .snarc-row .val { width: 32px; text-align: right; font-size: 9px; color: var(--text); }

  .peer-item { display: flex; align-items: center; gap: 6px; font-size: 10px; padding: 2px 0; }
  .peer-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .peer-dot.on { background: var(--accent); }
  .peer-dot.off { background: #ff3333; }
  .peer-dot.unknown { background: var(--text-dim); }
  .peer-name { color: var(--text); }
  .peer-info { color: var(--text-dim); font-size: 9px; }

  /* Chat panel */
  .chat-panel { display: flex; flex-direction: column; overflow: hidden; min-height: 0; }

  .chat-header {
    padding: 8px 16px; border-bottom: 1px solid var(--border);
    font-size: 11px; font-weight: 600; color: var(--accent);
    text-transform: uppercase; letter-spacing: 1px;
    background: var(--surface); flex-shrink: 0;
  }

  .chat-log {
    flex: 1; overflow-y: auto; padding: 12px 16px;
    display: flex; flex-direction: column; gap: 8px;
  }

  .chat-msg {
    padding: 8px 12px; border-radius: 6px; font-size: 13px;
    line-height: 1.5; max-width: 85%; word-wrap: break-word;
  }
  .chat-msg.user {
    background: #1a2a1a; border: 1px solid #2a4a2a;
    align-self: flex-end; color: #a0d0a0;
  }
  .chat-msg.sage {
    background: var(--surface); border: 1px solid var(--border); align-self: flex-start;
  }
  .chat-msg.error {
    background: #2a1a1a; border: 1px solid #4a2a2a; color: #ff6666;
  }
  .chat-msg.dream {
    background: #2a1a3a; border: 1px solid #4a2a5a; color: #cc88ff; font-style: italic;
  }
  .chat-msg .sender {
    font-weight: 700; font-size: 11px; margin-bottom: 2px;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .chat-msg.user .sender { color: var(--accent); }
  .chat-msg.sage .sender { color: var(--state-color); }
  .chat-msg .time { font-size: 9px; color: var(--text-dim); float: right; margin-left: 8px; }

  .chat-form {
    display: flex; gap: 8px; padding: 10px 16px;
    border-top: 1px solid var(--border); background: var(--surface); flex-shrink: 0;
  }
  .chat-form textarea {
    flex: 1; background: var(--bg); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 12px; color: var(--text);
    font-family: inherit; font-size: 13px; outline: none; resize: none;
    min-height: 36px; max-height: 120px; line-height: 1.4; overflow-y: auto;
  }
  .chat-form textarea:focus { border-color: var(--accent); }
  .chat-form textarea:disabled { opacity: 0.5; }
  .chat-form button {
    background: var(--accent); color: var(--bg); border: none; border-radius: 6px;
    padding: 8px 16px; font-family: inherit; font-size: 13px; font-weight: 700;
    cursor: pointer; text-transform: uppercase; letter-spacing: 1px;
  }
  .chat-form button:hover { opacity: 0.8; }
  .chat-form button:disabled { opacity: 0.4; cursor: not-allowed; }
  /* A conversation is with the BEING, which beats every ~30 minutes. The panel says which
     conversation, whose move it is, and when the next beat is, because a chat box that
     hides all three teaches its user that silence means failure. */
  .chat-header select { background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 4px; font-size: 11px; padding: 2px 6px; margin-left: 8px; }
  .conv-state { font-size: 10px; color: var(--text-dim); margin-left: 8px; }
  .conv-state.readonly { color: var(--warn, #d29922); }
  .conv-note { padding: 6px 10px; font-size: 10px; color: var(--text-dim);
    border-top: 1px solid var(--border); }
  .chat-msg.dp .sender { color: #a371f7; }
  .chat-msg.seat .sender { color: var(--accent); }
  .chat-msg.pending { opacity: 0.75; font-style: italic; }

  @media (max-width: 700px) {
    .grid { grid-template-columns: 1fr; grid-template-rows: auto 1fr; height: auto; }
    .sidebar {
      flex-direction: row; flex-wrap: wrap; border-right: none;
      border-bottom: 1px solid var(--border); padding: 8px; justify-content: center;
    }
    .avatar-wrap { width: 60px; height: 60px; }
    .stats-section { flex-direction: row; flex-wrap: wrap; }
    .stat-compact { flex: 1; min-width: 100px; }
    .chat-panel { height: 70vh; }
  }
</style>
</head>
<body>
  <header>
    <h1>SAGE</h1>
    <div class="meta">
      <span id="version-display">v--</span>
      <span id="cycle-display">Cycle: --</span>
      <span id="uptime-display">Up: --</span>
      <span><span class="connection-dot" id="conn-dot"></span> <span id="conn-label">connecting</span></span>
    </div>
  </header>

  <div class="grid">
    <section class="sidebar">
      <div class="avatar-wrap">
        <img src="/images/agentzero.png" alt="SAGE" id="sage-face" />
      </div>
      <div class="machine-name" id="machine-name">--</div>
      <div class="metabolic-badge" id="metabolic-badge">--</div>
      <div class="model-label" id="model-label">--</div>

      <div class="stats-section">
        <div class="stat-row">
          <div class="stat-compact">
            <label>ATP</label>
            <div class="value" id="atp-value">--</div>
            <div class="bar-wrap"><div class="bar-fill atp" id="atp-bar" style="width:0%"></div></div>
          </div>
          <div class="stat-compact">
            <label>Cycles</label>
            <div class="value" id="cycle-value">0</div>
            <div class="sub" id="messages-sub">msgs: --</div>
          </div>
        </div>

        <div class="stat-compact">
          <label>SNARC Salience</label>
          <div id="snarc-bars">
            <div class="snarc-row"><span class="name">surprise</span><div class="mini-bar"><div class="mini-fill" id="snarc-surprise" style="width:0%"></div></div><span class="val" id="val-surprise">-</span></div>
            <div class="snarc-row"><span class="name">novelty</span><div class="mini-bar"><div class="mini-fill" id="snarc-novelty" style="width:0%"></div></div><span class="val" id="val-novelty">-</span></div>
            <div class="snarc-row"><span class="name">arousal</span><div class="mini-bar"><div class="mini-fill" id="snarc-arousal" style="width:0%"></div></div><span class="val" id="val-arousal">-</span></div>
            <div class="snarc-row"><span class="name">reward</span><div class="mini-bar"><div class="mini-fill" id="snarc-reward" style="width:0%"></div></div><span class="val" id="val-reward">-</span></div>
            <div class="snarc-row"><span class="name">conflict</span><div class="mini-bar"><div class="mini-fill" id="snarc-conflict" style="width:0%"></div></div><span class="val" id="val-conflict">-</span></div>
          </div>
        </div>

        <div class="stat-compact">
          <label>Fleet</label>
          <div id="peer-list"><div class="sub">loading...</div></div>
        </div>

        <div class="stat-compact">
          <label>System</label>
          <div class="sub" id="sys-daemon">sage-daemon (Rust)</div>
          <div class="sub" id="sys-ollama">Ollama: --</div>
          <div class="sub" id="sys-fleet-size">Fleet: --</div>
        </div>
      </div>
    </section>

    <section class="chat-panel">
      <div class="chat-header">
        <span id="chat-sage-name">SAGE</span>
        <select id="conv-select" title="conversation"></select>
        <span id="conv-state" class="conv-state"></span>
      </div>
      <div class="chat-log" id="chat-log"></div>
      <form class="chat-form" id="chat-form">
        <textarea id="chat-input" placeholder="Say something..." autocomplete="off" rows="1"></textarea>
        <button type="submit" id="chat-send">Send</button>
      </form>
      <div class="conv-note" id="conv-note"></div>
    </section>
  </div>

<script>
const BASE = window.location.origin;
const STATE_COLORS = {
  wake: '#00ff41', focus: '#ffd700', rest: '#4488ff',
  dream: '#cc44ff', crisis: '#ff3333',
};

let machineName = 'sage';
let connected = false;

function setStateColor(state) {
  const color = STATE_COLORS[state] || STATE_COLORS.wake;
  document.documentElement.style.setProperty('--state-color', color);
}

function escapeHtml(text) {
  const d = document.createElement('div');
  d.textContent = text;
  return d.innerHTML;
}

function formatTime(ts) {
  if (!ts) return '';
  const d = new Date(ts * 1000);
  return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function formatUptime(secs) {
  const h = Math.floor(secs / 3600);
  const m = Math.floor((secs % 3600) / 60);
  return (h > 0 ? h + 'h ' : '') + m + 'm';
}

// --- Polling updates ---
async function refreshHealth() {
  try {
    const r = await fetch(BASE + '/health');
    const d = await r.json();
    document.getElementById('version-display').textContent = 'v' + d.version;
    document.getElementById('uptime-display').textContent = 'Up: ' + formatUptime(d.uptime_secs);
    document.getElementById('model-label').textContent = d.model;
    document.getElementById('sys-ollama').textContent = 'Ollama: ' + (d.ollama_available ? 'connected' : 'offline');
    document.getElementById('sys-ollama').style.color = d.ollama_available ? 'var(--accent)' : '#ff3333';
    if (!connected) {
      connected = true;
      document.getElementById('conn-dot').classList.add('connected');
      document.getElementById('conn-label').textContent = 'live';
    }
  } catch(e) {
    connected = false;
    document.getElementById('conn-dot').classList.remove('connected');
    document.getElementById('conn-label').textContent = 'offline';
  }
}

async function refreshStatus() {
  try {
    const r = await fetch(BASE + '/status');
    const d = await r.json();
    const state = (d.metabolic_state || 'wake').toLowerCase();
    document.getElementById('metabolic-badge').textContent = state.toUpperCase();
    setStateColor(state);

    const pct = d.atp_percentage || 0;
    document.getElementById('atp-value').textContent = pct.toFixed(0) + '%';
    const bar = document.getElementById('atp-bar');
    bar.style.width = pct + '%';
    bar.style.backgroundPosition = (100 - pct) + '% 0';

    document.getElementById('cycle-value').textContent = (d.total_cycles || 0).toLocaleString();
    document.getElementById('cycle-display').textContent = 'Cycle: ' + (d.total_cycles || 0).toLocaleString();
    document.getElementById('sys-fleet-size').textContent = 'Fleet: ' + (d.fleet_size || 0) + ' machines';
  } catch(e) {}
}

async function refreshPeers() {
  try {
    const r = await fetch(BASE + '/peers');
    const d = await r.json();
    if (d.self_machine) {
      machineName = d.self_machine;
      const cap = machineName.charAt(0).toUpperCase() + machineName.slice(1);
      document.getElementById('machine-name').textContent = cap;
      document.getElementById('chat-sage-name').textContent = cap;
      document.title = 'SAGE — ' + cap;
    }
    const el = document.getElementById('peer-list');
    if (d.peers && d.peers.length > 0) {
      el.innerHTML = d.peers.map(p => {
        const dotClass = p.online === true ? 'on' : p.online === false ? 'off' : 'unknown';
        const lat = p.latency_ms ? p.latency_ms.toFixed(0) + 'ms' : '';
        return '<div class="peer-item"><span class="peer-dot ' + dotClass + '"></span>' +
          '<span class="peer-name">' + escapeHtml(p.name) + '</span>' +
          '<span class="peer-info">' + escapeHtml(p.model || '') +
          (lat ? ' · ' + lat : '') + '</span></div>';
      }).join('');
    } else {
      el.innerHTML = '<div class="sub">no peers</div>';
    }
  } catch(e) {}
}

function updateSnarc(salience) {
  if (!salience) return;
  for (const dim of ['surprise','novelty','arousal','reward','conflict']) {
    const v = salience[dim] || 0;
    const bar = document.getElementById('snarc-' + dim);
    const val = document.getElementById('val-' + dim);
    if (bar) bar.style.width = (v * 100) + '%';
    if (val) val.textContent = v.toFixed(2);
  }
}

// --- Chat ---
const chatForm = document.getElementById('chat-form');
const chatInput = document.getElementById('chat-input');
const chatSend = document.getElementById('chat-send');
const chatLog = document.getElementById('chat-log');

function appendChat(sender, text, cssClass, timestamp) {
  const div = document.createElement('div');
  div.className = 'chat-msg ' + (cssClass || 'sage');
  const timeStr = timestamp ? '<span class="time">' + formatTime(timestamp) + '</span>' : '';
  div.innerHTML = '<div class="sender">' + timeStr + escapeHtml(sender) + '</div>' +
                  '<div>' + escapeHtml(text) + '</div>';
  chatLog.appendChild(div);
  chatLog.scrollTop = chatLog.scrollHeight;
}

async function loadChatHistory() {
  try {
    const r = await fetch(BASE + '/chat/history?limit=100');
    const d = await r.json();
    if (d.messages && d.messages.length > 0) {
      for (const m of d.messages) {
        appendChat(m.sender || 'unknown', m.text || '', m.css_class || 'sage', m.timestamp);
      }
    } else {
      appendChat(machineName, 'Dashboard connected. Type a message to begin.', 'sage');
    }
  } catch(e) {
    appendChat('SAGE', 'Dashboard connected. Type a message to begin.', 'sage');
  }
}

// --- Conversations -------------------------------------------------------
// The chat panel talks to the BEING, not to the model on this GPU. The being is
// governed and wakes on beats, so this is asynchronous by nature: a turn is recorded
// and answered at the next beat. Saying so on screen is the whole difference between
// "it is thinking" and "you have been ignored".
let convs = [];
let convId = null;
const convSelect = document.getElementById('conv-select');
const convState = document.getElementById('conv-state');
const convNote = document.getElementById('conv-note');

function convWritable(c) { return c && (c.writable_by || []).indexOf('dp') >= 0; }

function kindOf(from) {
  if (from === 'dp') return 'dp';
  if (/-being$/.test(from)) return 'sage';
  return 'seat';
}

async function loadConversations() {
  try {
    const r = await fetch(BASE + '/conversations');
    const d = await r.json();
    convs = d.conversations || [];
    const keep = convId;
    convSelect.innerHTML = '';
    convs.forEach(c => {
      const o = document.createElement('option');
      o.value = c.id;
      o.textContent = c.title + (convWritable(c) ? '' : '  (read-only)');
      convSelect.appendChild(o);
    });
    convId = (keep && convs.some(c => c.id === keep)) ? keep
           : (convs.find(convWritable) || convs[0] || {}).id || null;
    if (convId) { convSelect.value = convId; await loadConversation(convId); }
    else { convNote.textContent = 'No conversations on this machine yet.'; }
  } catch (e) {
    convNote.textContent = 'Could not load conversations: ' + e.message;
  }
}

async function loadConversation(id) {
  const c = convs.find(x => x.id === id);
  const writable = convWritable(c);
  chatLog.innerHTML = '';
  try {
    const r = await fetch(BASE + '/conversations/' + encodeURIComponent(id) + '?limit=50');
    const d = await r.json();
    if (d.total > d.showing) {
      const n = document.createElement('div');
      n.className = 'chat-msg';
      n.style.opacity = '0.6';
      n.textContent = 'Showing the last ' + d.showing + ' of ' + d.total +
                      ' turns. Nothing is ever deleted.';
      chatLog.appendChild(n);
    }
    (d.turns || []).forEach(t => appendChat(t.from, t.text, kindOf(t.from), t.ts));
    const waiting = (c && c.awaiting_being) || 0;
    convState.textContent = writable
      ? (waiting ? waiting + ' awaiting the being' : 'up to date')
      : 'read-only';
    convState.className = 'conv-state' + (writable ? '' : ' readonly');
    chatInput.disabled = !writable;
    chatSend.disabled = !writable;
    chatInput.placeholder = writable
      ? 'Say something to ' + (d.being || 'the being') + '...'
      : 'Read-only: this is the seat\'s conversation with the being.';
    convNote.textContent = writable
      ? 'Recorded now; answered at the being\'s next beat.'
      : 'You can read this conversation and not comment on it. Multiparty comes later.';
  } catch (e) {
    convNote.textContent = 'Could not load: ' + e.message;
  }
}

async function sendChat() {
  const message = chatInput.value.trim();
  if (!message || !convId) return;

  appendChat('dp', message, 'dp');
  chatInput.value = '';
  chatInput.disabled = true;
  chatSend.disabled = true;
  chatSend.textContent = '...';

  try {
    const r = await fetch(BASE + '/conversations/' + encodeURIComponent(convId) + '/say', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: message }),
    });
    const result = await r.json();
    if (result.error) {
      appendChat('System', result.error, 'error');
    } else {
      const a = result.arousal || {};
      const line = document.createElement('div');
      line.className = 'chat-msg pending';
      line.textContent = result.delivery + (a.reason ? ' — ' + a.reason : '');
      chatLog.appendChild(line);
      chatLog.scrollTop = chatLog.scrollHeight;
    }
    refreshStatus();
    loadConversations();
  } catch(err) {
    appendChat('System', 'Connection error: ' + err.message, 'error');
  } finally {
    chatInput.disabled = false;
    chatSend.disabled = false;
    chatSend.textContent = 'Send';
    chatInput.style.height = 'auto';
    chatInput.focus();
  }
}

convSelect.addEventListener('change', () => { convId = convSelect.value; loadConversation(convId); });

chatForm.addEventListener('submit', (e) => { e.preventDefault(); sendChat(); });
chatInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
});
chatInput.addEventListener('input', () => {
  chatInput.style.height = 'auto';
  chatInput.style.height = Math.min(chatInput.scrollHeight, 120) + 'px';
});

// --- Init ---
async function init() {
  await refreshPeers();
  // Conversations, not the raw chat history. loadChatHistory() reads
  // chat_history.jsonl — the record of prompts sent to the WEIGHTS — and is kept only
  // as a fallback for a machine with no conversations yet, so the panel is never blank.
  await loadConversations();
  if (!convId) loadChatHistory();
  refreshHealth();
  refreshStatus();
  setInterval(refreshHealth, 5000);
  setInterval(refreshStatus, 3000);
  setInterval(refreshPeers, 15000);
  // The being answers on its own rhythm; poll for its turn rather than making a person
  // reload to find out whether they were answered.
  setInterval(() => { if (convId) loadConversations(); }, 20000);
}
init();
</script>
</body>
</html>
