<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAGE Dashboard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a0a;
    --surface: #111;
    --border: #222;
    --text: #c8c8c8;
    --text-dim: #666;
    --accent: #00ff41;
    --state-wake: #00ff41;
    --state-wrap-up: #ffd700;
    --state-rest: #4488ff;
    --state-dream: #cc44ff;
    --state-crisis: #ff3333;
    --state-color: var(--state-wake);
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Courier New', monospace;
    font-size: 13px;
    line-height: 1.5;
    min-height: 100vh;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  header h1 { font-size: 14px; font-weight: 600; color: var(--accent); }
  header .meta {
    display: flex; gap: 16px; align-items: center;
    font-size: 11px; color: var(--text-dim);
  }

  .connection-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #ff3333; display: inline-block; transition: background 0.3s;
  }
  .connection-dot.connected { background: var(--accent); }

  .grid {
    display: grid;
    grid-template-columns: 220px 1fr;
    height: calc(100vh - 37px);
  }

  /* Sidebar */
  .sidebar {
    padding: 12px;
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    overflow-y: auto; background: var(--surface);
  }

  .avatar-wrap {
    position: relative; width: 120px; height: 120px;
    border-radius: 10px; overflow: hidden; flex-shrink: 0;
  }
  .avatar-wrap img {
    width: 100%; height: 100%; object-fit: cover; border-radius: 10px;
  }
  .avatar-wrap::after {
    content: ''; position: absolute; inset: -3px;
    border-radius: 13px; border: 2px solid var(--state-color);
    box-shadow: 0 0 16px color-mix(in srgb, var(--state-color) 40%, transparent);
    animation: glow 2s ease-in-out infinite; pointer-events: none;
  }
  @keyframes glow { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }

  .machine-name {
    font-size: 16px; font-weight: 700; color: white;
    text-transform: uppercase; letter-spacing: 2px;
  }
  .metabolic-badge {
    display: inline-block; padding: 3px 12px; border-radius: 20px;
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
    background: color-mix(in srgb, var(--state-color) 15%, transparent);
    color: var(--state-color); border: 1px solid var(--state-color);
  }
  .model-label { font-size: 10px; color: var(--text-dim); }

  .stats-section { width: 100%; margin-top: 4px; display: flex; flex-direction: column; gap: 6px; }

  .stat-compact {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 10px;
  }
  .stat-compact label {
    display: block; font-size: 9px; text-transform: uppercase;
    letter-spacing: 1px; color: var(--text-dim); margin-bottom: 2px;
  }
  .stat-compact .value { font-size: 14px; font-weight: 700; color: white; }
  .stat-compact .sub { font-size: 10px; color: var(--text-dim); }

  .stat-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }

  .bar-wrap { background: #1a1a1a; border-radius: 3px; height: 6px; overflow: hidden; margin-top: 3px; }
  .bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease, background 0.5s ease; }
  .bar-fill.atp { background: linear-gradient(90deg, #ff3333, #ffd700, #00ff41); background-size: 300% 100%; }

  .snarc-row { display: flex; align-items: center; gap: 4px; font-size: 10px; }
  .snarc-row .name { width: 60px; color: var(--text-dim); }
  .snarc-row .mini-bar { flex: 1; height: 4px; background: #1a1a1a; border-radius: 2px; overflow: hidden; }
  .snarc-row .mini-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.5s; }
  .snarc-row .val { width: 32px; text-align: right; font-size: 9px; color: var(--text); }

  .peer-item { display: flex; align-items: center; gap: 6px; font-size: 10px; padding: 2px 0; }
  .peer-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .peer-dot.on { background: var(--accent); }
  .peer-dot.off { background: #ff3333; }
  .peer-dot.unknown { background: var(--text-dim); }
  .peer-name { color: var(--text); }
  .peer-info { color: var(--text-dim); font-size: 9px; }

  /* Chat panel */
  .chat-panel { display: flex; flex-direction: column; overflow: hidden; min-height: 0; }

  .chat-header {
    padding: 8px 16px; border-bottom: 1px solid var(--border);
    font-size: 11px; font-weight: 600; color: var(--accent);
    text-transform: uppercase; letter-spacing: 1px;
    background: var(--surface); flex-shrink: 0;
  }

  .chat-log {
    flex: 1; overflow-y: auto; padding: 12px 16px;
    display: flex; flex-direction: column; gap: 8px;
  }

  .chat-msg {
    padding: 8px 12px; border-radius: 6px; font-size: 13px;
    line-height: 1.5; max-width: 85%; word-wrap: break-word;
  }
  .chat-msg.user {
    background: #1a2a1a; border: 1px solid #2a4a2a;
    align-self: flex-end; color: #a0d0a0;
  }
  .chat-msg.sage {
    background: var(--surface); border: 1px solid var(--border); align-self: flex-start;
  }
  .chat-msg.error {
    background: #2a1a1a; border: 1px solid #4a2a2a; color: #ff6666;
  }
  .chat-msg.dream {
    background: #2a1a3a; border: 1px solid #4a2a5a; color: #cc88ff; font-style: italic;
  }
  .chat-msg .sender {
    font-weight: 700; font-size: 11px; margin-bottom: 2px;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .chat-msg .trial-tag {
    font-weight: 600; font-size: 10px; margin-left: 6px; padding: 0 5px; border-radius: 3px;
    background: #3a2f10; color: #e8c060; border: 1px solid #6a5420; text-transform: none;
  }
  .chat-msg.user .sender { color: var(--accent); }
  .chat-msg.sage .sender { color: var(--state-color); }
  .chat-msg .time { font-size: 9px; color: var(--text-dim); float: right; margin-left: 8px; }

  /* THE BEING'S OUTPUT STREAM (GET /being/output; Python sage.gateway.being_stream). dp, 2026-11-20:
     the agent's stream is a key feature and liveness indicator in every major CLI harness. */
  .view-tabs { display: inline-flex; gap: 4px; margin-left: 10px; }
  .view-tab {
    background: transparent; color: var(--text-dim); border: 1px solid var(--border); border-radius: 3px;
    font: inherit; font-size: 10px; padding: 1px 8px; cursor: pointer; text-transform: uppercase;
  }
  .view-tab.on { color: var(--accent); border-color: var(--accent); }
  .out-live { margin-left: 10px; font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--text-dim); }
  .out-live.live { color: var(--accent); }
  .output-log {
    flex: 1; overflow-y: auto; padding: 12px 16px; display: none;
    white-space: pre-wrap; word-wrap: break-word; font-size: 12px;
  }
  .output-log.on { display: block; }
  .out-beat { color: var(--text-dim); border-top: 1px solid var(--border); margin-top: 10px; padding-top: 4px; }
  .out-call { color: var(--state-color); font-weight: 700; margin-top: 6px; }
  .out-think { color: var(--text-dim); font-style: italic; border-left: 2px solid var(--border); padding-left: 8px; }
  .out-text { color: var(--text); padding-left: 10px; }
  .out-tool { color: #e8c060; padding-left: 10px; }
  .out-done { color: var(--text-dim); font-size: 10px; padding-left: 10px; }
  .out-error { color: #ff6666; padding-left: 10px; }
  .out-end { color: var(--text-dim); font-size: 10px; }
  .out-empty { color: var(--text-dim); }

  .chat-form {
    display: flex; gap: 8px; padding: 10px 16px;
    border-top: 1px solid var(--border); background: var(--surface); flex-shrink: 0;
  }
  .chat-form textarea {
    flex: 1; background: var(--bg); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 12px; color: var(--text);
    font-family: inherit; font-size: 13px; outline: none; resize: none;
    min-height: 36px; max-height: 120px; line-height: 1.4; overflow-y: auto;
  }
  .chat-form textarea:focus { border-color: var(--accent); }
  .chat-form textarea:disabled { opacity: 0.5; }
  .chat-form button {
    background: var(--accent); color: var(--bg); border: none; border-radius: 6px;
    padding: 8px 16px; font-family: inherit; font-size: 13px; font-weight: 700;
    cursor: pointer; text-transform: uppercase; letter-spacing: 1px;
  }
  .chat-form button:hover { opacity: 0.8; }
  .chat-form button:disabled { opacity: 0.4; cursor: not-allowed; }
  /* A conversation is with the BEING, which beats every ~30 minutes. The panel says which
     conversation, whose move it is, and when the next beat is, because a chat box that
     hides all three teaches its user that silence means failure. */
  .chat-header select { background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 4px; font-size: 11px; padding: 2px 6px; margin-left: 8px; }
  .conv-state { font-size: 10px; color: var(--text-dim); margin-left: 8px; }
  .conv-state.readonly { color: var(--warn, #d29922); }
  .conv-state.busy { color: var(--warn, #d29922); }
  .conv-state.thinking { color: var(--accent, #58a6ff); }
  .conv-note { padding: 6px 10px; font-size: 10px; color: var(--text-dim);
    border-top: 1px solid var(--border); }
  /* a REFUSAL is not an empty list: shown at reading size, in the warning colour (dp 2026-10-08:
     over Tailscale the dropdown looked blank and the 10px dim note went unseen) */
  .conv-note.refused { font-size: 12px; color: #e8c060; background: #3a2f10; border-top: 1px solid #6a5420; }
  .conv-note.refused code { color: #f0d890; }
  .chat-msg.dp .sender { color: #a371f7; }
  .chat-msg.seat .sender { color: var(--accent); }
  .chat-msg.pending { opacity: 0.75; font-style: italic; }

  @media (max-width: 700px) {
    .grid { grid-template-columns: 1fr; grid-template-rows: auto 1fr; height: auto; }
    .sidebar {
      flex-direction: row; flex-wrap: wrap; border-right: none;
      border-bottom: 1px solid var(--border); padding: 8px; justify-content: center;
    }
    .avatar-wrap { width: 60px; height: 60px; }
    .stats-section { flex-direction: row; flex-wrap: wrap; }
    .stat-compact { flex: 1; min-width: 100px; }
    .chat-panel { height: 70vh; }
  }
</style>
</head>
<body>
  <header>
    <h1>SAGE</h1>
    <div class="meta">
      <span id="version-display">v--</span>
      <span id="beats-display">Beats: --</span>
      <span id="uptime-display">Up: --</span>
      <span><span class="connection-dot" id="conn-dot"></span> <span id="conn-label">connecting</span></span>
    </div>
  </header>

  <div class="grid">
    <section class="sidebar">
      <div class="avatar-wrap">
        <img src="/images/agentzero.png" alt="SAGE" id="sage-face" />
      </div>
      <div class="machine-name" id="machine-name">--</div>
      <div class="metabolic-badge" id="metabolic-badge">--</div>
      <!-- What the being is doing and for how long, and who said so (SAGE #291). -->
      <div class="model-label" id="metabolic-age">--</div>
      <div class="model-label" id="model-label">--</div>

      <div class="stats-section">
        <div class="stat-row">
          <div class="stat-compact">
            <label title="The daemon's internal ATP oscillator (a 10-second cycle). Not the being's energy, and not the state shown above (SAGE #291).">ATP (internal)</label>
            <div class="value" id="atp-value">--</div>
            <div class="bar-wrap"><div class="bar-fill atp" id="atp-bar" style="width:0%"></div></div>
          </div>
          <!-- Beats, from the heartbeat's reports (SAGE #295). Was "Cycles": the loop's 100 ms
               ticks, which counted uptime x 10 and nothing the being did. -->
          <div class="stat-compact">
            <label title="Beats that reported their end since the daemon started">Beats</label>
            <div class="value" id="beats-value">0</div>
            <div class="sub" id="beat-now">--</div>
            <div class="sub" id="messages-sub">msgs: --</div>
          </div>
        </div>

        <div class="stat-compact">
          <label>SNARC Salience</label>
          <div class="sub" id="snarc-empty">nothing felt yet</div>
          <div id="snarc-bars">
            <div class="snarc-row"><span class="name">surprise</span><div class="mini-bar"><div class="mini-fill" id="snarc-surprise" style="width:0%"></div></div><span class="val" id="val-surprise">-</span></div>
            <div class="snarc-row"><span class="name">novelty</span><div class="mini-bar"><div class="mini-fill" id="snarc-novelty" style="width:0%"></div></div><span class="val" id="val-novelty">-</span></div>
            <div class="snarc-row"><span class="name">arousal</span><div class="mini-bar"><div class="mini-fill" id="snarc-arousal" style="width:0%"></div></div><span class="val" id="val-arousal">-</span></div>
            <div class="snarc-row"><span class="name">reward</span><div class="mini-bar"><div class="mini-fill" id="snarc-reward" style="width:0%"></div></div><span class="val" id="val-reward">-</span></div>
            <div class="snarc-row"><span class="name">conflict</span><div class="mini-bar"><div class="mini-fill" id="snarc-conflict" style="width:0%"></div></div><span class="val" id="val-conflict">-</span></div>
          </div>
        </div>

        <!-- The machine body (proprioception): the daemon's last sample, the same `line` the being
             reads in its beat, so the indicator and the being cannot disagree. An indicator only. -->
        <div class="stat-compact">
          <label title="GPU, CPU, memory and disk, sampled by the daemon every few seconds. Gaps are named, never filled.">Body</label>
          <div id="body-rows"><div class="sub">not sensed yet</div></div>
          <div class="sub" id="body-age">--</div>
        </div>

        <div class="stat-compact">
          <label>Fleet</label>
          <div id="peer-list"><div class="sub">loading...</div></div>
        </div>

        <div class="stat-compact">
          <label>System</label>
          <div class="sub" id="sys-daemon">sage-daemon (Rust)</div>
          <div class="sub" id="sys-ollama">Ollama: --</div>
          <div class="sub" id="sys-fleet-size">Fleet: --</div>
        </div>
      </div>
    </section>

    <section class="chat-panel">
      <div class="chat-header">
        <span id="chat-sage-name">SAGE</span>
        <select id="conv-select" title="conversation"></select>
        <span id="conv-state" class="conv-state"></span>
        <span class="view-tabs">
          <button type="button" class="view-tab on" id="tab-conv" title="the conversations">conversation</button>
          <button type="button" class="view-tab" id="tab-output" title="what the being is producing, as it produces it">output</button>
        </span>
        <span class="out-live" id="out-live" title="is the being producing output right now?">○ --</span>
      </div>
      <div class="chat-log" id="chat-log"></div>
      <div class="output-log" id="output-log"><div class="out-empty">no output yet</div></div>
      <form class="chat-form" id="chat-form">
        <textarea id="chat-input" placeholder="Say something..." autocomplete="off" rows="1"></textarea>
        <button type="submit" id="chat-send">Send</button>
      </form>
      <div class="conv-note" id="conv-note"></div>
    </section>
  </div>

<script>
const BASE = window.location.origin;
const STATE_COLORS = {
  // The activity indicator's states (SAGE #291). `focus` was the old oscillator's salience
  // state; nothing reports it now. `wrap-up` is the end of a beat (reflect, answer).
  wake: '#00ff41', 'wrap-up': '#ffd700', rest: '#4488ff',
  dream: '#cc44ff', crisis: '#ff3333',
};

let machineName = 'sage';
let connected = false;

function setStateColor(state) {
  const color = STATE_COLORS[state] || STATE_COLORS.rest;
  document.documentElement.style.setProperty('--state-color', color);
}

function fmtAge(secs) {
  if (secs == null) return '?';
  if (secs < 90) return secs + 's';
  if (secs < 5400) return Math.round(secs / 60) + 'm';
  if (secs < 172800) return (secs / 3600).toFixed(1) + 'h';
  return Math.round(secs / 86400) + 'd';
}

function describeActivity(d) {
  if (d.metabolic_age_secs == null) return '';
  const src = d.metabolic_source || 'unknown';
  if (d.metabolic_decayed) {
    return 'for ' + fmtAge(d.metabolic_age_secs) + ' \u00b7 no report from ' + src.replace(/^stale:/, '');
  }
  return 'for ' + fmtAge(d.metabolic_age_secs) + ' \u00b7 ' + src;
}

// The beat running now (its phase and how many phase reports it has made), or how long since
// the last one ended (SAGE #295).
function describeBeat(b) {
  if (b.current) {
    return 'now: ' + b.current.phase + ' · ' + b.current.phase_reports + ' phase report'
      + (b.current.phase_reports === 1 ? '' : 's') + ' · ' + fmtAge(b.current.age_secs);
  }
  if (b.since_last_beat_end_secs != null) return 'last ended ' + fmtAge(b.since_last_beat_end_secs) + ' ago';
  return 'no beat since the daemon started';
}

function escapeHtml(text) {
  const d = document.createElement('div');
  d.textContent = text;
  return d.innerHTML;
}

// Two timestamp shapes reach this: chat history carries epoch seconds (a number, or a numeric
// string like "1789329766.8"), and conversation turns carry ISO-8601 ("2026-09-14T08:00:13Z").
// Treating every value as epoch seconds turned every conversation turn into "Invalid Date"
// (dp, 2026-09-14). A turn from another day shows its date, since conversations span months.
function formatTime(ts) {
  if (ts === null || ts === undefined || ts === '') return '';
  // BOTH SHAPES. This did `new Date(ts * 1000)`, which assumes Unix epoch SECONDS — true
  // of the telemetry it was written for, and false of conversation turns, which carry ISO
  // 8601 strings ("2026-09-14T00:30:17Z"). A string times 1000 is NaN, and new Date(NaN)
  // renders as "Invalid Date", which is what dp saw on every turn of his own conversation
  // with the being (reported 2026-09-14).
  const n = Number(ts);
  const d = Number.isFinite(n) ? new Date(n * 1000) : new Date(ts);
  if (isNaN(d.getTime())) return String(ts);   // show the raw value, never "Invalid Date"
  const time = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  const sameDay = d.toDateString() === new Date().toDateString();
  return sameDay ? time : d.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ' ' + time;
}

function formatUptime(secs) {
  const h = Math.floor(secs / 3600);
  const m = Math.floor((secs % 3600) / 60);
  return (h > 0 ? h + 'h ' : '') + m + 'm';
}

// --- Polling updates ---
async function refreshHealth() {
  try {
    const r = await fetch(BASE + '/health');
    const d = await r.json();
    document.getElementById('version-display').textContent = d.build || ('v' + d.version);
    document.getElementById('uptime-display').textContent = 'Up: ' + formatUptime(d.uptime_secs);
    // The model actually loaded, not only the configured one (dp 2026-10-13: the label said 2B while the being ran
    // the 4B). Embedding models are not the being's mind and are left out of the label.
    const minds = (d.loaded_models || []).filter(m => !/embed/i.test(m));
    let label = d.model;
    if (d.model_loaded === false && minds.length) label = 'configured ' + d.model + ' \u00b7 loaded ' + minds.join(', ');
    else if (d.model_loaded === false) label = d.model + ' (not loaded right now)';
    document.getElementById('model-label').textContent = label;
    document.getElementById('sys-ollama').textContent = 'Ollama: ' + (d.ollama_available ? 'connected' : 'offline');
    document.getElementById('sys-ollama').style.color = d.ollama_available ? 'var(--accent)' : '#ff3333';
    if (!connected) {
      connected = true;
      document.getElementById('conn-dot').classList.add('connected');
      document.getElementById('conn-label').textContent = 'live';
    }
  } catch(e) {
    connected = false;
    document.getElementById('conn-dot').classList.remove('connected');
    document.getElementById('conn-label').textContent = 'offline';
  }
}

async function refreshStatus() {
  try {
    const r = await fetch(BASE + '/status');
    const d = await r.json();
    const state = (d.metabolic_state || 'unknown').toLowerCase();
    document.getElementById('metabolic-badge').textContent = state.toUpperCase();
    setStateColor(state);
    // How long, and who said so: an indicator that cannot say its own age reads as current.
    document.getElementById('metabolic-age').textContent = describeActivity(d);

    const pct = d.atp_percentage || 0;
    document.getElementById('atp-value').textContent = pct.toFixed(0) + '%';
    const bar = document.getElementById('atp-bar');
    bar.style.width = pct + '%';
    bar.style.backgroundPosition = (100 - pct) + '% 0';

    // Beats, not loop ticks (SAGE #295): counted from the heartbeat's reports.
    const beats = d.beats || {};
    document.getElementById('beats-value').textContent = (beats.completed || 0).toLocaleString();
    document.getElementById('beats-display').textContent = 'Beats: ' + (beats.completed || 0).toLocaleString();
    document.getElementById('beat-now').textContent = describeBeat(beats);
    lastBeats = beats;
    if (convId && convs.length) renderConvState();
    document.getElementById('sys-fleet-size').textContent = 'Fleet: ' + (d.fleet_size || 0) + ' machines';
    // The SNARC the being last felt. updateSnarc() was defined and never called from the day
    // the conversations rewrite landed, so these bars read 0.00 on every machine (SAGE #111).
    updateSnarc(d.salience);
  } catch(e) {}
}

async function refreshPeers() {
  try {
    const r = await fetch(BASE + '/peers');
    const d = await r.json();
    if (d.self_machine) {
      machineName = d.self_machine;
      const cap = machineName.charAt(0).toUpperCase() + machineName.slice(1);
      document.getElementById('machine-name').textContent = cap;
      document.getElementById('chat-sage-name').textContent = cap;
      document.title = 'SAGE — ' + cap;
    }
    const el = document.getElementById('peer-list');
    if (d.peers && d.peers.length > 0) {
      el.innerHTML = d.peers.map(p => {
        const dotClass = p.online === true ? 'on' : p.online === false ? 'off' : 'unknown';
        const lat = p.latency_ms ? p.latency_ms.toFixed(0) + 'ms' : '';
        return '<div class="peer-item"><span class="peer-dot ' + dotClass + '"></span>' +
          '<span class="peer-name">' + escapeHtml(p.name) + '</span>' +
          '<span class="peer-info">' + escapeHtml(p.model || '') +
          (lat ? ' · ' + lat : '') + '</span></div>';
      }).join('');
    } else {
      el.innerHTML = '<div class="sub">no peers</div>';
    }
  } catch(e) {}
}

// The machine body. Renders the snapshot's own `line` (one renderer, in the sampler) as rows,
// and says how old it is: a reading that cannot say its age reads as current.
async function refreshBody() {
  const rows = document.getElementById('body-rows');
  const age = document.getElementById('body-age');
  try {
    const r = await fetch(BASE + '/body');
    const d = await r.json();
    if (!r.ok || !d.line) {
      rows.innerHTML = '<div class="sub">not sensed: ' + escapeHtml(d.unavailable || ('HTTP ' + r.status)) + '</div>';
      age.textContent = '--';
      return;
    }
    rows.innerHTML = d.line.split(' | ').map(p =>
      '<div class="sub" style="color:' + (p.startsWith('unavailable:') ? 'var(--text-dim)' : 'var(--text)') + '">' +
      escapeHtml(p) + '</div>').join('');
    const s = d.served_age_s;
    const err = d.sampler && d.sampler.last_error ? ' · last sample failed: ' + d.sampler.last_error.error : '';
    age.textContent = (s == null ? 'age unknown' : 'sampled ' + fmtAge(s) + ' ago') + err;
  } catch (e) {
    rows.innerHTML = '<div class="sub">not sensed: the daemon did not answer /body</div>';
    age.textContent = '--';
  }
}

function updateSnarc(salience) {
  // No salience is not zero salience: the being has processed nothing yet, or the loop is not
  // publishing. Say so rather than drawing five empty bars that look like a measurement.
  const el = document.getElementById('snarc-empty');
  if (el) el.style.display = salience ? 'none' : '';
  if (!salience) return;
  for (const dim of ['surprise','novelty','arousal','reward','conflict']) {
    const v = salience[dim] || 0;
    const bar = document.getElementById('snarc-' + dim);
    const val = document.getElementById('val-' + dim);
    if (bar) bar.style.width = (v * 100) + '%';
    if (val) val.textContent = v.toFixed(2);
  }
}

// --- Chat ---
const chatForm = document.getElementById('chat-form');
const chatInput = document.getElementById('chat-input');
const chatSend = document.getElementById('chat-send');
const chatLog = document.getElementById('chat-log');

function appendChat(sender, text, cssClass, timestamp, trial) {
  const div = document.createElement('div');
  div.className = 'chat-msg ' + (cssClass || 'sage');
  const timeStr = timestamp ? '<span class="time">' + formatTime(timestamp) + '</span>' : '';
  // a live trial's label, beside the words and never in them (SAGE #337)
  const trialStr = trial ? ' <span class="trial-tag">' + 'TEST · ' + escapeHtml(trial) + '</span>' : '';
  div.innerHTML = '<div class="sender">' + timeStr + escapeHtml(sender) + trialStr + '</div>' +
                  '<div>' + escapeHtml(text) + '</div>';
  chatLog.appendChild(div);
  chatLog.scrollTop = chatLog.scrollHeight;
}

async function loadChatHistory() {
  try {
    const r = await fetch(BASE + '/chat/history?limit=100');
    const d = await r.json();
    if (d.messages && d.messages.length > 0) {
      for (const m of d.messages) {
        appendChat(m.sender || 'unknown', m.text || '', m.css_class || 'sage', m.timestamp);
      }
    } else {
      appendChat(machineName, 'Dashboard connected. Type a message to begin.', 'sage');
    }
  } catch(e) {
    appendChat('SAGE', 'Dashboard connected. Type a message to begin.', 'sage');
  }
}

// --- Conversations -------------------------------------------------------
// The chat panel talks to the BEING, not to the model on this GPU. The being is
// governed and wakes on beats, so this is asynchronous by nature: a turn is recorded
// and answered at the next beat. Saying so on screen is the whole difference between
// "it is thinking" and "you have been ignored".
let convs = [];
let convRefused = false;   // /conversations answered 403 (not loopback): unknown, not empty
let convId = null;
const convSelect = document.getElementById('conv-select');
const convState = document.getElementById('conv-state');
const convNote = document.getElementById('conv-note');

function convWritable(c) { return c && (c.writable_by || []).indexOf('dp') >= 0; }

// --- Waiting for the being (SAGE #788) -------------------------------------
// dp, 2026-11-18, after a demo: a model that answers fast and shows it is working FEELS more
// capable. The being cannot answer in a second, but the page can stop being silent about why.
// Two things were wrong here: the page looked for the being's reply every 20 s, so a reply written
// in 10 s could take 30 s to appear, and while a turn waited it said only "1 awaiting the being".
// Now, while a turn is waiting, the page polls every 2 s and says what the beat is actually doing,
// from the heartbeat's own phase reports (/status beats.current). "Writing its answer" is shown
// only when the beat has reported its answer phase; nothing here is a decorative spinner.
const POLL_IDLE_MS = 20000;
const POLL_WAITING_MS = 2000;
let lastBeats = null;     // /status beats, kept by refreshStatus
let shownCount = null;    // turn count of the log on screen; a poll reloads it only when this changes
let beingName = null;

function pollDelay(awaiting) { return awaiting > 0 ? POLL_WAITING_MS : POLL_IDLE_MS; }

// What the being is doing while a turn waits (SAGE #788). dp, 2026-11-19: no cancelling an in-flight
// model call; let it complete, then switch attention, and say 'busy' (not 'thinking') meanwhile.
// 'thinking' is said ONLY when the heartbeat has reported its answer phase.
function waitingState(beats, awaiting) {
  if (!awaiting) return null;
  const cur = beats && beats.current;
  if (cur && cur.phase === 'answer') return 'thinking';
  if (cur) return 'busy';
  return 'waiting';
}

function waitingLine(being, beats, awaiting) {
  const state = waitingState(beats, awaiting);
  if (!state) return null;
  const who = being || 'the being';
  const turns = awaiting === 1 ? '1 turn waiting' : awaiting + ' turns waiting';
  const cur = beats && beats.current;
  if (state === 'thinking') {
    return 'thinking \u00b7 ' + turns + ': ' + who + ' is writing its answer now.';
  }
  if (state === 'busy') {
    return 'busy \u00b7 ' + turns + ': ' + who + ' is mid-beat (' + cur.phase + ', running ' +
           fmtAge(cur.age_secs) + '); the step it is on runs to completion before it answers.';
  }
  if (beats && beats.since_last_beat_end_secs != null) {
    return 'waiting \u00b7 ' + turns + ': no beat is running (the last ended ' +
           fmtAge(beats.since_last_beat_end_secs) + ' ago); waiting for one to start.';
  }
  return 'waiting \u00b7 ' + turns + ': waiting for a beat to start.';
}

function renderConvState() {
  const c = convs.find(x => x.id === convId);
  const writable = convWritable(c);
  convState.textContent = writable
    ? (waitingLine(beingName, lastBeats, (c && c.awaiting_being) || 0) || 'up to date')
    : 'read-only';
  const state = writable ? waitingState(lastBeats, (c && c.awaiting_being) || 0) : null;
  convState.className = 'conv-state' + (writable ? '' : ' readonly') + (state ? ' ' + state : '');
}

function convAwaiting() {
  const c = convs.find(x => x.id === convId);
  return (c && c.awaiting_being) || 0;
}

let pollTimer = null;
function schedulePoll() {
  clearTimeout(pollTimer);
  pollTimer = setTimeout(pollConversations, pollDelay(convAwaiting()));
}

async function pollConversations() {
  try { if (convId) await loadConversations(true); }
  finally { schedulePoll(); }
}

function kindOf(from) {
  if (from === 'dp') return 'dp';
  if (/-being$/.test(from)) return 'sage';
  return 'seat';
}

// A REFUSAL IS NOT AN ABSENCE (dp, 2026-09-27: "i still don't see separate conversations in the
// sage console"). /conversations answers only over loopback, and this function never checked
// r.ok: viewed from another device, the 403's JSON had no `conversations` field, so the panel
// said "No conversations on this machine yet." on a machine that had them, and fell back to the
// raw-model chat. The daemon's own words -- why it refused, and where to read instead -- are
// shown now, and the panel does not pretend the machine is empty.
async function loadConversations(poll = false) {
  try {
    const r = await fetch(BASE + '/conversations');
    const d = await r.json().catch(() => ({}));
    if (!r.ok) {
      convs = []; convId = null; convSelect.innerHTML = '';
      const o = document.createElement('option');
      o.textContent = '(not readable from this device)'; o.disabled = true; o.selected = true;
      convSelect.appendChild(o);
      convNote.classList.add('refused');
      convNote.textContent = 'Conversations are not shown from here: ' + (d.error || ('HTTP ' + r.status)) +
        (d.hint ? ' ' + d.hint + '.' : '') + ' This is not "none" -- the machine did not say.';
      if (r.status === 403 || /loopback/.test(d.error || '')) {
        // the one way that works from another device: arrive as loopback through an SSH tunnel
        const port = location.port || '8760', host = location.hostname;
        const tip = document.createElement('div');
        tip.innerHTML = 'From another device: <code>ssh -N -L ' + port + ':127.0.0.1:' + port + ' &lt;user&gt;@' +
          escapeHtml(host) + '</code> then open <code>http://localhost:' + port + '</code>';
        convNote.appendChild(tip);
      }
      convRefused = true;
      return;
    }
    convRefused = false;
    convNote.classList.remove('refused');
    convs = d.conversations || [];
    const keep = convId;
    convSelect.innerHTML = '';
    convs.forEach(c => {
      const o = document.createElement('option');
      o.value = c.id;
      o.textContent = c.title + (convWritable(c) ? '' : '  (read-only)');
      convSelect.appendChild(o);
    });
    convId = (keep && convs.some(c => c.id === keep)) ? keep
           : (convs.find(convWritable) || convs[0] || {}).id || null;
    if (convId) {
      convSelect.value = convId;
      // A poll reloads the log only when the conversation grew: rebuilding it every 2 s while a turn
      // waits would reset the scroll and flicker. Otherwise only the waiting line is refreshed.
      const cur = convs.find(c => c.id === convId);
      if (!poll || !cur || cur.count !== shownCount) await loadConversation(convId);
      else renderConvState();
    }
    else {
      // Empty really is empty here (the daemon answered). Say whose move that is: nothing in the
      // fleet creates a being's conversations automatically -- the seat does, once.
      convNote.textContent = 'No conversations exist for ' + (d.being || 'this being') + ' on this machine. ' +
        'The seat creates them (sage.gateway.conversations.create: a "dp" one, and one named for the seat). ' +
        'Until then the box below talks to the raw model, not the being.';
    }
  } catch (e) {
    convNote.textContent = 'Could not load conversations: ' + e.message;
  }
}

async function loadConversation(id) {
  const c = convs.find(x => x.id === id);
  const writable = convWritable(c);
  chatLog.innerHTML = '';
  try {
    const r = await fetch(BASE + '/conversations/' + encodeURIComponent(id) + '?limit=50');
    const d = await r.json();
    if (d.total > d.showing) {
      const n = document.createElement('div');
      n.className = 'chat-msg';
      n.style.opacity = '0.6';
      n.textContent = 'Showing the last ' + d.showing + ' of ' + d.total +
                      ' turns. Nothing is ever deleted.';
      chatLog.appendChild(n);
    }
    (d.turns || []).forEach(t => appendChat(t.from, t.text, kindOf(t.from), t.ts, t.trial));
    shownCount = c ? c.count : null;
    if (d.being) beingName = d.being;
    renderConvState();
    chatInput.disabled = !writable;
    chatSend.disabled = !writable;
    chatInput.placeholder = writable
      ? 'Say something to ' + (d.being || 'the being') + '...'
      : 'Read-only: this is the seat\'s conversation with the being.';
    convNote.textContent = writable
      ? 'Recorded now; answered at the being\'s next beat.'
      : 'You can read this conversation and not comment on it. Multiparty comes later.';
  } catch (e) {
    convNote.textContent = 'Could not load: ' + e.message;
  }
}

async function sendChat() {
  const message = chatInput.value.trim();
  if (!message || !convId) return;

  appendChat('dp', message, 'dp');
  chatInput.value = '';
  chatInput.disabled = true;
  chatSend.disabled = true;
  chatSend.textContent = '...';

  try {
    const r = await fetch(BASE + '/conversations/' + encodeURIComponent(convId) + '/say', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: message }),
    });
    const result = await r.json();
    if (result.error) {
      appendChat('System', result.error, 'error');
    } else {
      const a = result.arousal || {};
      const line = document.createElement('div');
      line.className = 'chat-msg pending';
      line.textContent = result.delivery + (a.reason ? ' — ' + a.reason : '');
      chatLog.appendChild(line);
      chatLog.scrollTop = chatLog.scrollHeight;
    }
    refreshStatus();
    // Awaited, then the poll is re-armed at once: a turn just sent must not sit behind a 20 s timer
    // armed while nothing was waiting.
    await loadConversations();
    schedulePoll();
  } catch(err) {
    appendChat('System', 'Connection error: ' + err.message, 'error');
  } finally {
    chatInput.disabled = false;
    chatSend.disabled = false;
    chatSend.textContent = 'Send';
    chatInput.style.height = 'auto';
    chatInput.focus();
  }
}

convSelect.addEventListener('change', () => { convId = convSelect.value; loadConversation(convId); });

chatForm.addEventListener('submit', (e) => { e.preventDefault(); sendChat(); });
chatInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
});
chatInput.addEventListener('input', () => {
  chatInput.style.height = 'auto';
  chatInput.style.height = Math.min(chatInput.scrollHeight, 120) + 'px';
});

// --- Init ---
async function init() {
  await refreshPeers();
  // Conversations, not the raw chat history. loadChatHistory() reads
  // chat_history.jsonl — the record of prompts sent to the WEIGHTS — and is kept only
  // as a fallback for a machine with no conversations yet, so the panel is never blank.
  await loadConversations();
  // The raw-model history is a fallback for a machine that HAS no conversations -- never for one
  // that refused to say, where showing it would dress the model up as the being.
  if (!convId && !convRefused) loadChatHistory();
  refreshHealth();
  refreshStatus();
  refreshBody();
  setInterval(refreshBody, 10000);
  setInterval(refreshHealth, 5000);
  setInterval(refreshStatus, 3000);
  setInterval(refreshPeers, 15000);
  // The being answers on its own rhythm; poll for its turn rather than making a person
  // reload to find out whether they were answered. Every 2 s while a turn waits, else 20 s (#788).
  schedulePoll();
}
// ---- the being's output stream -------------------------------------------------------------------------------
// Polled once a second by byte offset (GET /being/output?after=N returns only what was appended). The live line in
// the header shows on both views: whether output is arriving now, and in which turn.
const OUT_LIVE_S = 5, OUT_KEEP = 4000;
let outOffset = null, outEvents = [], outView = false, outBusy = false, outRefused = '';

function outAgo(s) { s = Math.floor(s); return s < 120 ? s + 's' : s < 7200 ? Math.floor(s / 60) + 'm' : Math.floor(s / 3600) + 'h'; }
function outHms(t) { return new Date(t * 1000).toISOString().slice(11, 19); }

function outStatus(now) {
  if (outRefused) return ['✗ output not readable here', false];
  if (!outEvents.length) return ['○ no output yet', false];
  const last = outEvents[outEvents.length - 1], age = Math.max(0, now - (last.t || 0));
  const call = [...outEvents].reverse().find(e => e.k === 'call');
  const turn = (call && call.turn) || '?';
  const active = { think: 'thinking', text: 'writing', tool: 'calling a tool', call: 'waiting for the model' };
  if (last.k === 'end') return ['○ resting · last beat ended ' + outAgo(age) + ' ago', false];
  if (last.k === 'beat') return ['◐ beat starting (' + outAgo(age) + ' ago) · no model call yet', false];
  if (active[last.k] && age <= OUT_LIVE_S) return ['● live · ' + active[last.k] + ' (' + turn + ')', true];
  if (active[last.k]) return ['◐ in a beat · no output for ' + outAgo(age) + ' (' + turn + ')', false];
  return ['◐ in a beat (' + turn + ') · last call ended ' + outAgo(age) + ' ago', false];
}

function outRender() {
  const log = document.getElementById('output-log');
  const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
  log.textContent = '';
  if (outRefused) { const d = document.createElement('div'); d.className = 'out-error'; d.textContent = outRefused; log.appendChild(d); return; }
  if (!outEvents.length) { log.innerHTML = '<div class="out-empty">no output yet: the stream starts with the next beat</div>'; return; }
  let cur = null, curKind = '';
  const add = (cls, text) => { const d = document.createElement('div'); d.className = cls; d.textContent = text; log.appendChild(d); return d; };
  for (const e of outEvents) {
    if ((e.k === 'think' || e.k === 'text') && cur && curKind === e.k) { cur.textContent += e.s || ''; continue; }
    cur = null; curKind = '';
    if (e.k === 'beat') add('out-beat', 'beat ' + String(e.beat || '').slice(-12) + '  ' + outHms(e.t) + 'Z  ' + (e.model || ''));
    else if (e.k === 'call') add('out-call', '▸ ' + (e.turn || '?') + ' · ' + (e.phase || '') + '  ' + outHms(e.t) + 'Z');
    else if (e.k === 'think' || e.k === 'text') { cur = add('out-' + e.k, e.s || ''); curKind = e.k; }
    else if (e.k === 'tool') add('out-tool', '⚙ ' + e.name + '(' + (e.args || '') + ')');
    else if (e.k === 'done') add('out-done', '✓ ' + (e.reason || 'done') + ' · ' + (e.eval_count ?? '?') + ' tokens · ' + (e.s_elapsed ?? '?') + 's');
    else if (e.k === 'error') add('out-error', '✗ ' + (e.s || ''));
    else if (e.k === 'end') add('out-end', 'beat ended ' + outHms(e.t) + 'Z');
  }
  if (atBottom) log.scrollTop = log.scrollHeight;
}

async function refreshOutput() {
  // ONE POLL AT A TIME (legion on #800): a slow reply must not let a second poll read from the same offset
  if (outBusy) return;
  outBusy = true;
  let changed = false;
  try {
    const r = await fetch(BASE + '/being/output' + (outOffset === null ? '' : '?after=' + outOffset));
    const d = await r.json();
    if (r.ok) {
      if (outRefused) { outRefused = ''; changed = true; }
      if (d.reset) { outEvents = []; changed = true; }
      if (d.events && d.events.length) { outEvents = outEvents.concat(d.events).slice(-OUT_KEEP); changed = true; }
      outOffset = d.offset;
    } else {
      // A REFUSAL IS SHOWN, NOT AN EMPTY STREAM (legion on #800): off this machine the route answers 403
      const why = (d.error || ('HTTP ' + r.status)) + (d.hint ? ' — ' + d.hint : '');
      if (why !== outRefused) { outRefused = why; changed = true; }
    }
  } catch (e) { /* the header keeps its last word; the next poll tries again */ }
  finally { outBusy = false; }
  const [line, live] = outStatus(Date.now() / 1000);
  const el = document.getElementById('out-live');
  el.textContent = line; el.classList.toggle('live', live);
  if (changed && outView) outRender();
}

function setView(output) {
  outView = output;
  document.getElementById('tab-conv').classList.toggle('on', !output);
  document.getElementById('tab-output').classList.toggle('on', output);
  document.getElementById('chat-log').style.display = output ? 'none' : '';
  document.getElementById('chat-form').style.display = output ? 'none' : '';
  document.getElementById('conv-note').style.display = output ? 'none' : '';
  document.getElementById('output-log').classList.toggle('on', output);
  if (output) { outRender(); const log = document.getElementById('output-log'); log.scrollTop = log.scrollHeight; }
}
document.getElementById('tab-conv').addEventListener('click', () => setView(false));
document.getElementById('tab-output').addEventListener('click', () => setView(true));
refreshOutput();
setInterval(refreshOutput, 1000);

init();
</script>
</body>
</html>
