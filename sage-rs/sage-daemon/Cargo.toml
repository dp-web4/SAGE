[package]
name = "sage-daemon"
version = "0.1.0"
edition = "2021"

[dependencies]
sage-lib = { path = "../sage-lib" }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["json"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
futures-util = "0.3"
async-stream = "0.3"
uuid = { version = "1", features = ["v4"] }
# flock(2) for the conversation store, whose other writer is the Python heartbeat.
# Already present transitively; named here because this crate calls it directly.
libc = "0.2"

[dev-dependencies]
tempfile = "3"
